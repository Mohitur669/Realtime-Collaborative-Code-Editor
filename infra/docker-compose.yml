version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sync_code_postgres
    restart: always
    environment:
      POSTGRES_DB: sync_code
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sync_code_redis
    restart: always
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: sync_code_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: sync_code_livekit
    restart: always
    command: --dev
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: sync_code_api
    restart: always
    environment:
      PORT: 3000
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecretsecret
      LIVEKIT_URL: ws://livekit:7880
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - livekit

  collab:
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    container_name: sync_code_collab
    restart: always
    environment:
      HOCUSPOCUS_PORT: 1234
    ports:
      - '1234:1234'
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    container_name: sync_code_client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - api
      - collab

volumes:
  postgres_data:
  minio_data:
